name: CI

on:
  push:
    branches: [main, master, dev, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

jobs:
  build:
    name: build + typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      - name: tsc --noEmit (root project)
        run: pnpm exec tsc --noEmit

      - name: Biome (lint + format check)
        run: pnpm exec biome check . --max-diagnostics=200

  unit-tests:
    name: unit tests (core + plugins)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 恢复了依赖缓存时 pnpm 不再跑 puppeteer 的安装脚本，而浏览器不在缓存里，要单独装
      - name: Install Chrome
        run: pnpm exec puppeteer browsers install chrome

      # 绘图测试要 ffmpeg；页面布局测试要页面字体表里的 Noto Sans CJK；
      # Ubuntu 23.10 起 AppArmor 不许非特权用户命名空间，Chrome 带沙箱无法启动
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build (produce dist for runtime imports)
        run: pnpm -r build

      # 排除式而非枚举式：枚举会静默漏掉新目录——实测曾漏掉 test/architecture 与
      # test/utils 共 78 个用例（含守「包间版本范围」不变量的那条），CI 从未跑过它们。
      # integration 单独一个 job 跑（要真实 npm、耗时长），故这里排除它。
      - name: Run unit tests
        run: pnpm exec vitest run --exclude 'test/integration/**'

  integration-tests:
    name: integration tests (end-to-end + lifecycle + recovery)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (produce dist for runtime imports)
        run: pnpm -r build

      - name: Run integration tests
        run: pnpm exec vitest run test/integration

  # 与 preflight 同一道门：只跑 test/core，只统计 packages/core/src，四项阈值都是 100（见 vitest.core-coverage.config.ts）
  coverage:
    name: core coverage (100% thresholds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Core coverage
        run: pnpm run coverage:core

  knip:
    name: knip (dead code / unused deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (knip loads configs that import other packages' dist)
        run: pnpm -r build

      - name: knip
        run: pnpm exec knip --no-progress
