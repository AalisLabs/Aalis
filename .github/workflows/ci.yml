name: CI

on:
  push:
    branches: [main, master, dev, 'feat/**', 'fix/**']
  pull_request:
    branches: [main, master, dev]
  workflow_dispatch:

jobs:
  build:
    name: build + typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      - name: tsc --noEmit (root project)
        run: pnpm exec tsc --noEmit

      - name: Biome (lint + format check)
        run: pnpm exec biome check . --max-diagnostics=200

  unit-tests:
    name: unit tests (core + plugins)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 恢复了依赖缓存时 pnpm 不再跑 puppeteer 的安装脚本，而浏览器不在缓存里，要单独装
      - name: Install Chrome
        run: pnpm exec puppeteer browsers install chrome

      - name: Build (produce dist for runtime imports)
        run: pnpm -r build

      # 排除式而非枚举式：枚举会静默漏掉新目录——实测曾漏掉 test/architecture 与
      # test/utils 共 78 个用例（含守「包间版本范围」不变量的那条），CI 从未跑过它们。
      # integration 单独一个 job 跑（要真实 npm、耗时长），故这里排除它。
      - name: Run unit tests
        run: pnpm exec vitest run --exclude 'test/integration/**'

  integration-tests:
    name: integration tests (end-to-end + lifecycle + recovery)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (produce dist for runtime imports)
        run: pnpm -r build

      - name: Run integration tests
        run: pnpm exec vitest run test/integration

  coverage:
    name: full coverage report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 同 unit-tests：缓存命中时浏览器要单独装
      - name: Install Chrome
        run: pnpm exec puppeteer browsers install chrome

      - name: Build (produce dist for runtime imports)
        run: pnpm -r build

      - name: Run tests with coverage
        run: pnpm run test --coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  knip:
    name: knip (dead code / unused deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (knip loads configs that import other packages' dist)
        run: pnpm -r build

      - name: knip
        run: pnpm exec knip --no-progress
